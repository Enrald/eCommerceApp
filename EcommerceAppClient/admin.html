<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">ShopZone</title>

    <link rel="icon" type="image/png" href="Images/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-100 pt-20">
    <!-- ========== HEADER ========== -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white shadow h-20">
        <div class="max-w-7xl mx-auto h-full px-4 sm:px-6 flex items-center justify-between">

            <!-- Logo -->
            <a href="index.html" class="flex items-center space-x-2">
                <img src="Images/logo.png" alt="ShopZone Logo" class="h-12 w-12 object-contain" />
                <span class="hidden sm:inline text-2xl font-bold text-gray-700"
                    style="font-family: 'Pacifico', cursive;">
                    ShopZone
                </span>
            </a>

            <!-- Search -->
            <form class="relative flex-1 mx-6 hidden md:block max-w-3xl">
                <input id="search-input" type="text" placeholder="What are you looking for?"
                    class="w-full pl-10 pr-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1110.5 3a7.5 7.5 0 016.15 13.65z" />
                    </svg>
                </div>
            </form>

            <!-- Icons -->
            <div class="flex items-center space-x-6">
                <!-- Cart -->
                <div class="relative">
                    <a href="cart.html" aria-label="Cart" class="text-gray-700 hover:text-blue-600 transition p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.35 2.7a1 1 0 00.9 1.5h12.5M7 13l-4-8m0 0h.01" />
                        </svg>
                    </a>
                    <span id="cart-count"
                        class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full">0</span>
                </div>

                <!-- User -->
                <div class="relative" x-data="{open:false}">
                    <button id="user-icon" @click.prevent="open=!open"
                        class="text-gray-700 hover:text-blue-600 transition p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M5.121 17.804A9 9 0 1118.88 6.196 9 9 0 015.12 17.804zM15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                    <div id="user-menu" x-show="open" x-transition @click.outside="open=false"
                        class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded shadow-lg py-1 text-sm"
                        style="display: none;">
                        <a href="login.html" class="block px-4 py-2 hover:bg-gray-100 text-gray-700">Log in</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100 text-gray-700">Settings</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <section class="p-6 max-w-7xl mx-auto mt-24">
        <h2 class="text-2xl font-bold mb-4 text-gray-700">Menaxhimi i Përdoruesve</h2>

        <!-- Search filter -->
        <div class="mb-4">
            <input id="userSearchInput" type="text"
                class="w-full md:w-1/3 px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Kërko përdorues sipas emrit ose emailit...">
        </div>

        <!-- User table -->
        <div class="overflow-x-auto bg-white rounded-lg shadow-md">
            <table id="userTable" class="min-w-full text-sm text-left text-gray-700">
                <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Emri</th>
                        <th class="px-4 py-3">Email</th>
                        <th class="px-4 py-3">Roli</th>
                        <th class="px-4 py-3">Statusi</th>
                        <th class="px-4 py-3">Veprime</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Përdoruesi 2 -->
                    <tr class="border-b hover:bg-gray-50" data-user-id="2">
                        <td class="px-4 py-3">1</td>
                        <td class="px-4 py-3">Luis Kadiu</td>
                        <td class="px-4 py-3">luis@example.com</td>
                        <td class="px-4 py-3" id="role-2">manager</td>
                        <td class="px-4 py-3" id="status-2">
                            <span
                                class="inline-block px-2 py-1 text-xs font-medium text-red-800 bg-red-100 rounded-full">I
                                bllokuar</span>
                        </td>
                        <td class="px-4 py-3 space-x-2">
                            <button id="activate-2" class="text-blue-600 hover:underline">Aktivo</button>
                            <button id="makeAdmin-2" class="text-green-600 hover:underline">Bëj Admin</button>
                            <button id="delete-2" class="text-red-600 hover:underline">Fshij</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>

</html>
