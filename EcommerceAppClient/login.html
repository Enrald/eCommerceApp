<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ShopZone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <button onclick="history.back()"
    class="absolute top-4 left-4 bg-gray-200 text-black px-4 py-2 rounded hover:bg-gray-300 transition">
    ← Back
  </button>


  <main id="login-main" class="w-full max-w-md bg-white rounded-2xl shadow-md p-8 space-y-6">
    <h1 id="login-title" class="text-3xl font-bold text-center text-gray-800">Log in to ShopZone</h1>

    <!-- Email -->
    <div class="space-y-2">
      <label for="login-email" class="block text-sm font-medium text-gray-700">Email address</label>
      <input type="email" id="login-email" name="email" required placeholder="you@example.com"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Password -->
    <div class="space-y-2">
      <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" id="login-password" name="password" required placeholder="••••••••"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Remember me + Forgot -->
    <div class="flex items-center justify-between text-sm">
      <label class="flex items-center space-x-2">
        <input id="remember-me" type="checkbox" class="text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <span class="text-gray-700">Remember me</span>
      </label>
      <a href="#" id="forgot-password" class="text-blue-600 hover:underline">Forgot password?</a>
    </div>

    <!-- Button -->
    <div>
      <button id="login-button"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
        Log In
      </button>
    </div>

    <!-- Sign Up -->
    <p class="text-center text-sm text-gray-600">
      Don't have an account?
      <a href="register.html" id="signup-link" class="text-blue-600 hover:underline font-medium">Sign up here</a>
    </p>
  </main>
</body>

</html>
