<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">ShopZone</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/logo.png" />
    <!-- Font Pacifico -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine (nëse duhet më vonë për dropdown) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-100 pt-20">

    <!-- ================= HEADER ================= -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white shadow h-20">
        <div class="max-w-7xl mx-auto h-full px-4 sm:px-6 flex items-center justify-between">

            <!-- Logo + Emri -->
            <a href="index.html" class="flex items-center space-x-2">
                <img src="Images/logo.png" alt="ShopZone Logo" class="h-12 w-12 object-contain" />
                <span class="hidden sm:inline text-2xl font-bold text-gray-700"
                    style="font-family: 'Pacifico', cursive;">ShopZone</span>
            </a>

            <!-- Search -->
            <form class="relative flex-1 mx-6 hidden md:block max-w-3xl">
                <input id="search-input" type="text" placeholder="What are you looking for?"
                    class="w-full pl-10 pr-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1110.5 3a7.5 7.5 0 016.15 13.65z" />
                    </svg>
                </div>
            </form>

            <!-- Ikonat -->
            <div class="flex items-center space-x-6">
                <!-- Cart -->
                <div class="relative">
                    <a href="#" aria-label="Cart" class="text-gray-700 hover:text-blue-600 transition p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.35 2.7a1 1 0 00.9 1.5h12.5M7 13l-4-8m0 0h.01" />
                        </svg>
                    </a>
                    <span id="cart-count"
                        class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full">0</span>
                </div>

                <!-- User (dropdown mund të aktivizohet më vonë me Alpine/JS) -->
                <div class="relative" x-data="{open:false}">
                    <button id="user-icon" @click.prevent="open=!open"
                        class="text-gray-700 hover:text-blue-600 transition p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M5.121 17.804A9 9 0 1118.88 6.196 9 9 0 015.12 17.804zM15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                    <div id="user-menu" x-show="open" x-transition @click.outside="open=false"
                        class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded shadow-lg py-1 text-sm"
                        style="display:none;">
                        <a href="login.html" class="block px-4 py-2 hover:bg-gray-100 text-gray-700">Log in</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100 text-gray-700">Settings</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="min-h-screen pt-32 px-4 md:px-16 bg-gray-100">
        <div class="max-w-6xl mx-auto bg-white p-8 rounded-2xl shadow-md">

            <!-- Titulli -->
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Shporta juaj</h1>

            <!-- Mesazh bosh (mund ta aktivizojmë me JS) -->
            <p id="empty-cart-message" class="text-gray-500 hidden">Shporta është bosh.</p>

            <!-- Lista e produkteve -->
            <div id="cart-items-container" class="space-y-6">

                <!-- Produkt -->
                <div class="cart-item flex flex-col md:flex-row items-center justify-between border-b pb-4 gap-6"
                    data-id="product-1">

                    <!-- Foto dhe Info -->
                    <div class="flex items-center space-x-4">
                        <img src="img/sample-product.jpg" alt="Produkt" class="w-24 h-24 object-cover rounded-lg">
                        <div>
                            <h2 class="text-lg font-semibold text-gray-800" id="product-name-1">Emri i Produktit</h2>
                            <p class="text-sm text-gray-500" id="product-color-1">Ngjyra: e zezë</p>
                            <button id="remove-btn-1"
                                class="remove-btn text-sm text-red-500 mt-1 hover:underline">Hiqe</button>
                        </div>
                    </div>

                    <!-- Sasia dhe Çmimi -->
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center border rounded-md">
                            <button id="decrease-qty-1"
                                class="decrease-btn w-8 h-8 text-lg font-medium hover:bg-gray-100">−</button>
                            <input id="quantity-input-1" type="number" value="1" min="1"
                                class="quantity-input w-12 text-center border-x outline-none">
                            <button id="increase-qty-1"
                                class="increase-btn w-8 h-8 text-lg font-medium hover:bg-gray-100">+</button>
                        </div>
                        <p id="product-price-1" class="text-lg font-semibold text-gray-700">$49.99</p>
                    </div>
                </div>

                <!-- Mund të shtojmë më shumë div.cart-item për produkte të tjera -->

            </div>

            <!-- Totali -->
            <div id="cart-total-section"
                class="mt-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <p class="text-xl font-semibold text-gray-800">
                    Totali: <span id="cart-total-price" class="text-green-600">$49.99</span>
                </p>
                <div class="flex gap-4 w-full md:w-auto">
                    <a href="index.html" id="continue-shopping"
                        class="w-full md:w-auto text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium px-6 py-3 rounded-xl">
                        Vazhdo blerjet
                    </a>
                    <a href="checkout.html" id="checkout-button"
                        class="w-full md:w-auto text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl">
                        Vazhdo me Pagesën
                    </a>
                </div>
            </div>
        </div>
    </main>



</body>

</html>
